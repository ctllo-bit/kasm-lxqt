<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{.Title}}</title>
    <style>
        /* ================= 基础变量定义 ================= */
        :root {
            --primary-color: #4f46e5;       /* 主题品牌色 (Indigo) */
            --primary-hover: #4338ca;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #111827;
            --text-muted: #6b7280;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --input-focus-border: #6366f1;
            --focus-ring: rgba(99, 102, 241, 0.15);
            --error-color: #ef4444;
        }

        /* ================= 全局重置 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 登录卡片容器 ================= */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            padding: 48px 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* ================= 头部样式 ================= */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #818cf8);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* ================= 表单输入区 ================= */
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* 输入框左侧图标 */
        .input-icon {
            position: absolute;
            left: 16px;
            color: #9ca3af;
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 46px; /* 左侧留出图标空间 */
            font-size: 16px;
            color: var(--text-main);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #a1a1aa;
        }

        /* 焦点状态 */
        input:focus {
            background: #ffffff;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input:focus + .input-icon {
            color: var(--primary-color);
        }

        /* 密码可见性切换按钮 */
        .toggle-password {
            position: absolute;
            right: 16px;
            color: #9ca3af;
            cursor: pointer;
            width: 20px;
            height: 20px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* ================= 提交按钮 ================= */
        button[type="submit"] {
            width: 100%;
            height: 52px;
            background: var(--primary-color);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        button[type="submit"]:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
        }

        /* ================= 移动端适配 (响应式) ================= */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-wrapper {
                padding: 40px 24px;
                border-radius: 20px;
            }

            .login-header {
                margin-bottom: 32px;
            }

            .login-header h2 {
                font-size: 24px;
            }

            input[type="text"],
            input[type="password"],
            button[type="submit"] {
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-header">
            <!-- Kasm 图标/自定义Logo -->
            <div class="login-logo">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <h2>KasmClient</h2>
            <p>登录到您的安全工作空间</p>
        </div>

        <form action="{{.Path}}" method="post">
            <!-- 用户名输入组 -->
            <div class="input-group">
                <label for="username">账号</label>
                <div class="input-wrapper">
                    <input type="text" name="username" id="username" placeholder="请输入您的用户名" autocomplete="username" required>
                    <!-- User Icon -->
                    <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
            </div>

            <!-- 密码输入组 -->
            <div class="input-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="password" placeholder="请输入您的密码" autocomplete="current-password" required>
                    <!-- Lock Icon -->
                    <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <!-- Eye Icon (Toggle Password) -->
                    <svg class="toggle-password" id="togglePassword" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </div>
            </div>

            <!-- 提交按钮 -->
            <button type="submit">
                登录
                <!-- 箭头Icon增加引导感 -->
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </form>
    </div>

    <!-- 交互脚本：切换密码显示/隐藏 -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // 切换输入框类型
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // 切换图标样式 (闭眼/睁眼)
            if (type === 'text') {
                this.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                `;
            } else {
                this.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        });
    </script>
</body>

</html>
