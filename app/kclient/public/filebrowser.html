<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="public/css/filebrowser.css">
    <script src="public/js/socket.io.min.js"></script>
    <script defer src="public/js/filebrowser.js"></script>
  </head>
  <body>
    <span id="buttons">
      <input id="folderName" type="text" placeholder="Enter Directory Name">
      <button type="button" id="createFolderBtn">Create Folder</button>
      <button type="button" id="uploadBtn">Upload Files</button>
      <input class="hidden" id="uploadInput" type="file" multiple>
    </span>

    <div id="filebrowser"></div>

    <div id="dropzone"></div>
  </body>
</html>
